[project]
name = "bikeshare-mlops"
version = "0.1.0"
description = "Chaîne MLOps de prévision des locations horaires de vélos (UCI Bike Sharing)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.21",
    "prefect>=3.1",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
load = [
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare_mlops"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --cov=bikeshare_mlops --cov-report=term-missing"
markers = [
    "integration: tests qui assemblent plusieurs composants (sans réseau)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["bikeshare_mlops"]
