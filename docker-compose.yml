name: bikeshare

x-app-image: &app-image
  image: bikeshare-mlops:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      CODE_VERSION: ${CODE_VERSION:-unknown}

x-app-database: &app-database
  BIKESHARE_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-bikeshare}:${POSTGRES_PASSWORD:-bikeshare}@postgres:5432/${POSTGRES_DB:-bikeshare}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bikeshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikeshare}
      POSTGRES_DB: ${POSTGRES_DB:-bikeshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mlflow:
    <<: *app-image
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER:-bikeshare}:${POSTGRES_PASSWORD:-bikeshare}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  prefect-server:
    <<: *app-image
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-bikeshare}:${POSTGRES_PASSWORD:-bikeshare}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      # L'UI est générée au démarrage : dossier inscriptible par l'utilisateur non-root de l'image.
      PREFECT_UI_STATIC_DIRECTORY: /home/app/prefect-ui
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *app-image
    command: alembic upgrade head
    environment:
      <<: *app-database
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    command: >
      uvicorn bikeshare_mlops.api.main:create_app --factory
      --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --no-access-log
    environment:
      <<: *app-database
      BIKESHARE_MLFLOW__TRACKING_URI: http://mlflow:5000
      # Registre injoignable : /model/reload échoue en quelques secondes (défaut MLflow : 7 essais).
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pipeline-worker:
    <<: *app-image
    command: python -m bikeshare_mlops.pipelines.serve
    environment:
      <<: *app-database
      PREFECT_API_URL: http://prefect-server:4200/api
      BIKESHARE_MLFLOW__TRACKING_URI: http://mlflow:5000
      BIKESHARE_ALERTS__WEBHOOK_URL: ${BIKESHARE_ALERTS__WEBHOOK_URL:-}
    volumes:
      # Mêmes dossiers que l'hôte : un lot déposé par `make next-batch` est vu par le worker.
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
