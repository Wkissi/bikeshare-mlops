# Configuration unique du projet.
# Toute clé peut être surchargée par une variable d'environnement :
#   BIKESHARE_<SECTION>__<CLE>, ex. BIKESHARE_LOGGING__LEVEL=DEBUG
# Le fichier lu peut être remplacé via BIKESHARE_CONFIG_FILE.

project_name: bikeshare-mlops

paths:
  data_dir: data
  raw_dir: data/raw              # archive UCI et hour.csv extrait
  batches_dir: data/batches      # lots mensuels rejouables (batch_YYYY_MM.csv)
  incoming_dir: data/incoming    # lots « arrivés », en attente de traitement
  processed_dir: data/processed  # lots validés, cumulés pour l'entraînement
  rejected_dir: data/rejected    # lots refusés par les contrôles qualité
  reports_dir: reports           # rapports de validation (JSON)
  logs_dir: logs

data:
  source_url: https://archive.ics.uci.edu/static/public/275/bike+sharing+dataset.zip
  archive_sha256: b70182d0d0508e9abbb79306ce5c0cec34869000f8220175ac83d11dbe845401
  csv_name: hour.csv
  download_timeout_s: 60

quality:
  min_rows: 500                  # un mois complet compte ~700 lignes horaires
  max_report_failures: 200       # nb max de cas d'échec détaillés dans le rapport

training:
  test_fraction: 0.2             # part des relevés réservée au jeu de test
  split_salt: bikeshare          # sel du découpage par hash (changer = autre partition)
  min_train_rows: 1000           # en dessous, l'entraînement est refusé
  model:                         # RandomForestRegressor
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 2
    max_features: 0.8
    n_jobs: -1
    random_state: 42

logging:
  level: INFO
  json_format: true
