# Configuration unique du projet.
# Toute clé peut être surchargée par une variable d'environnement :
#   BIKESHARE_<SECTION>__<CLE>, ex. BIKESHARE_LOGGING__LEVEL=DEBUG
# Le fichier lu peut être remplacé via BIKESHARE_CONFIG_FILE.

project_name: bikeshare-mlops

paths:
  data_dir: data
  raw_dir: data/raw              # archive UCI et hour.csv extrait
  batches_dir: data/batches      # lots mensuels rejouables (batch_YYYY_MM.csv)
  incoming_dir: data/incoming    # lots « arrivés », en attente de traitement
  processed_dir: data/processed  # lots validés, cumulés pour l'entraînement
  rejected_dir: data/rejected    # lots refusés par les contrôles qualité
  reports_dir: reports           # rapports de validation (JSON)
  logs_dir: logs

data:
  source_url: https://archive.ics.uci.edu/static/public/275/bike+sharing+dataset.zip
  archive_sha256: b70182d0d0508e9abbb79306ce5c0cec34869000f8220175ac83d11dbe845401
  csv_name: hour.csv
  download_timeout_s: 60

quality:
  min_rows: 500                  # un mois complet compte ~700 lignes horaires
  max_report_failures: 200       # nb max de cas d'échec détaillés dans le rapport

training:
  test_fraction: 0.2             # part des relevés réservée au jeu de test
  split_salt: bikeshare          # sel du découpage par hash (changer = autre partition)
  min_train_rows: 1000           # en dessous, l'entraînement est refusé
  model:                         # RandomForestRegressor (compromis précision / taille / latence)
    n_estimators: 60             # 200 arbres : RMSE -2 % mais modèle x6 et latence x2,4
    max_depth: 15
    min_samples_leaf: 3
    max_features: 0.8
    n_jobs: -1
    random_state: 42

mlflow:
  tracking_uri: http://localhost:5000     # dans Docker : http://mlflow:5000 (variable d'env)
  experiment_name: bikeshare-demand
  ingestion_experiment_name: bikeshare-ingestion   # un run par lot reçu (métadonnées + rapport qualité)
  registered_model_name: bikeshare-rf
  artifact_location: null                  # null = stockage géré par le serveur MLflow

promotion:
  # Le challenger devient champion seulement si TOUTES les conditions sont remplies.
  min_improvement_pct: 2.0           # RMSE au moins 2 % meilleur que le champion (même jeu de test)
  min_gain_vs_baseline_pct: 30.0     # non-régression : RMSE au moins 30 % sous la baseline
  max_segment_degradation_pct: 10.0  # non-régression : aucune saison dégradée de plus de 10 %
  max_single_prediction_ms: 200.0    # non-régression : latence médiane d'une prédiction unitaire

orchestration:
  training_cron: "0 6 * * 1"     # réentraînement hebdomadaire (lundi 6 h) sur toutes les données
  watch_interval_s: 60           # fréquence de surveillance de data/incoming
  task_retries: 3                # tâches réseau (MLflow) : nouvelles tentatives
  retry_delay_s: 10

alerts:
  webhook_url: null              # URL Slack/Discord/… ; via BIKESHARE_ALERTS__WEBHOOK_URL (secret)
  file_name: alerts.jsonl        # toujours écrit dans paths.logs_dir
  timeout_s: 5

logging:
  level: INFO
  json_format: true
